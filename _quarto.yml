project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - sessions/*.qmd
    - case-study/*.qmd
    - exercises/*.qmd
    - solutions/*.qmd
    - ai/*.qmd
    - slides/r-for-actuaries-2026.qmd

website:
  title: "R for Actuaries 2026"
  favicon: images/actex_logo.png
  page-navigation: true
  repo-url: https://github.com/fgazzelloni/r-for-actuaries-2026
  repo-actions: [edit, issue]
  sidebar:
    logo: images/actex_logo.png
    style: docked
    search: true
    contents:
      - href: index.qmd
        text: Course Overview
      - href: slides/r-for-actuaries-2026.qmd
        text: Presentation Slides
      - section: Sessions
        contents:
          - href: sessions/01-introduction.qmd
            text: "1. Introduction to R"
          - href: sessions/02-analysis.qmd
            text: "2. Actuarial Analysis"
          - href: sessions/03-visualization.qmd
            text: "3. Visualization and Reporting"
      - section: Case Study
        contents:
          - href: case-study/actuarial-mini-project.qmd
            text: Mini Project
          - href: case-study/data_dictionary.qmd
            text: Data Dictionary
      - section: Exercises
        contents:
          - href: exercises/session01.qmd
            text: Session 1
          - href: exercises/session02.qmd
            text: Session 2
          - href: exercises/session03.qmd
            text: Session 3
      - section: AI Guidance
        contents:
          - href: ai/ai-use-guidelines.qmd
            text: AI Use Guidelines
          - href: ai/prompt-patterns.qmd
            text: Prompt Patterns
          - href: ai/ai-checkpoints.qmd
            text: AI Checkpoints

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true

execute:
  freeze: auto
